name: Scratch AI agent

on:
  workflow_dispatch:
  schedule:
    # Offset from the busiest start-of-hour window to reduce scheduler delays.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: read

concurrency:
  group: scratch-ai-agent
  cancel-in-progress: false

jobs:
  run-agent:
    if: github.event_name != 'schedule' || vars.CLOUDFLARE_SCHEDULER_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SCRATCH_USERNAME: ${{ secrets.SCRATCH_USERNAME }}
      SCRATCH_SESSION_STRING: ${{ secrets.SCRATCH_SESSION_STRING }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BOT_MODE: private
      AUDIENCE_MODE: everyone
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'qwen3.6-27b' }}
      MAX_REPLY_CHARS: ${{ vars.MAX_REPLY_CHARS || '500' }}
      PERSONA_FILE: ${{ vars.PERSONA_FILE || 'persona.txt' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Scratch agent once
        run: python -m app.main
