name: Scratch AI agent

on:
  workflow_dispatch:
  schedule:
    # Once per hour to keep private-repository Actions usage low during testing.
    # You can still run it manually at any time from the Actions page.
    - cron: "7 * * * *"

permissions:
  contents: read

concurrency:
  group: scratch-ai-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SCRATCH_USERNAME: ${{ secrets.SCRATCH_USERNAME }}
      SCRATCH_SESSION_STRING: ${{ secrets.SCRATCH_SESSION_STRING }}
      SCRATCH_PROJECT_ID: ${{ secrets.SCRATCH_PROJECT_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
      BOT_MODE: ${{ vars.BOT_MODE || 'simulate' }}
      AUDIENCE_MODE: ${{ vars.AUDIENCE_MODE || 'allowlist' }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.1-8b-instant' }}
      MAX_RECENT_COMMENTS: ${{ vars.MAX_RECENT_COMMENTS || '20' }}
      MAX_REPLIES_PER_RUN: ${{ vars.MAX_REPLIES_PER_RUN || '2' }}
      MAX_REPLY_CHARS: ${{ vars.MAX_REPLY_CHARS || '300' }}
      PERSONA_FILE: ${{ vars.PERSONA_FILE || 'persona.txt' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run Scratch agent once
        run: python -m app.main
