name: Scratch AI agent

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: read

concurrency:
  group: scratch-ai-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SCRATCH_USERNAME: ${{ secrets.SCRATCH_USERNAME }}
      SCRATCH_SESSION_STRING: ${{ secrets.SCRATCH_SESSION_STRING }}
      SCRATCH_PROJECT_ID: ${{ secrets.SCRATCH_PROJECT_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BOT_MODE: private
      AUDIENCE_MODE: everyone
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.1-8b-instant' }}
      MAX_RECENT_COMMENTS: ${{ vars.MAX_RECENT_COMMENTS || '20' }}
      MAX_REPLIES_PER_RUN: ${{ vars.MAX_REPLIES_PER_RUN || '5' }}
      MAX_REPLY_CHARS: ${{ vars.MAX_REPLY_CHARS || '500' }}
      MAX_THREAD_MESSAGES: ${{ vars.MAX_THREAD_MESSAGES || '12' }}
      PERSONA_FILE: ${{ vars.PERSONA_FILE || 'persona.txt' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Scratch agent once
        run: python -m app.main