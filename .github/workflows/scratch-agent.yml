name: Scratch AI agent

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # This new group avoids being blocked by pending runs created by the removed
  # native schedule under the old scratch-ai-agent concurrency group.
  group: scratch-ai-agent-cloudflare
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SCRATCH_USERNAME: ${{ secrets.SCRATCH_USERNAME }}
      SCRATCH_SESSION_STRING: ${{ secrets.SCRATCH_SESSION_STRING }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      BOT_MODE: private
      AUDIENCE_MODE: everyone
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'groq' }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'qwen/qwen3.6-27b' }}
      MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL || 'mistral-medium-3-5' }}
      MISTRAL_AGENT_ID: ${{ vars.MISTRAL_AGENT_ID || 'ag_019fb93b7afe7301a5ca1c9ddd416890' }}
      MAX_REPLY_CHARS: ${{ vars.MAX_REPLY_CHARS || '500' }}
      PERSONA_FILE: ${{ vars.PERSONA_FILE || 'persona.txt' }}
      OUTREACH_ENABLED: ${{ vars.OUTREACH_ENABLED || 'false' }}
      OUTREACH_USERS_FILE: ${{ vars.OUTREACH_USERS_FILE || 'config/outreach_users.txt' }}
      OUTREACH_INTERVAL_MINUTES: ${{ vars.OUTREACH_INTERVAL_MINUTES || '480' }}
      FULL_SCAN_ENABLED: ${{ vars.FULL_SCAN_ENABLED || 'false' }}
      FULL_SCAN_INTERVAL_MINUTES: ${{ vars.FULL_SCAN_INTERVAL_MINUTES || '360' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Scratch agent once
        run: python -m app.main
